# DUST 的 CI/CD：
#   - push 到 main / 開 PR → 輸出 Windows 版，打包成 Actions Artifact（保留 14 天）
#   - 推 v* 標籤（例如 v0.2.0）→ 另外建立 GitHub Release，附上 zip 給朋友下載
# 需要的 Secrets（Settings → Secrets and variables → Actions）：
#   UNITY_EMAIL、UNITY_PASSWORD、UNITY_LICENSE（Personal 授權 .ulf 檔的內容）
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NAME: DUST

jobs:
  build:
    name: Build Windows
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      built: ${{ steps.license.outputs.ok }}
    steps:
      # 還沒設定授權（或是從 fork 來的 PR 拿不到 secrets）時跳過，不要整條紅掉
      - name: Check Unity license secrets
        id: license
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_LICENSE" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_EMAIL / UNITY_PASSWORD / UNITY_LICENSE 尚未設定，跳過建置"
          fi

      # Unity Editor 的 Docker image 很大，先清掉 runner 上用不到的東西
      - name: Free disk space
        if: steps.license.outputs.ok == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        if: steps.license.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 版本號從 git 標籤算

      # Library 快取：不用每次重新匯入所有素材、編譯 HDRP shader
      - name: Cache Library
        if: steps.license.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-

      - name: Build
        if: steps.license.outputs.ok == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: ${{ env.BUILD_NAME }}
          versioning: Semantic

      - name: Upload build
        if: steps.license.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-Windows
          path: |
            build/StandaloneWindows64
            !build/StandaloneWindows64/*_DoNotShip
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-Windows
          path: ${{ env.BUILD_NAME }}

      - name: Zip
        run: zip -r "${BUILD_NAME}-${GITHUB_REF_NAME}-Windows.zip" "${BUILD_NAME}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${BUILD_NAME}-${GITHUB_REF_NAME}-Windows.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DUST $GITHUB_REF_NAME" \
            --generate-notes
